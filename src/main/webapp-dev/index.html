<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="index.css">
  <title>Portfolio</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Edu+NSW+ACT+Cursive:wght@400..700&display=swap');
  </style>
</head>

<body>
  <div class="bg-animation-container">
    <div class="background-animation">
      <div class="an-el-one an-el"></div>
      <div class="an-el-two an-el"></div>
      <div class="an-el-three an-el"></div>
      <div class="an-el-four an-el"></div>
      <div class="an-el-five an-el"></div>
    </div>
    <svg xmlns="http://www.w3.org/2000/svg" style="position: absolute; width: 0; height: 0;">

      <filter id="displacementFilter">
        <feTurbulence type="turbulence" baseFrequency="0.01" numOctaves="2" result="turbulence" />

        <feDisplacementMap in="SourceGraphic" in2="turbulence" scale="200" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>
    <div id="root"></div>
    <h1 class="footnote">Handcrafted WebApp</h1>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
